<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Wrimble is a tool, not another AI. A 10-minute daily writing workout where you type every word and we teach you the why.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>You're on the list · Wrimble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600&display=swap">
<style>
/* Layout: a school exercise book. Blue ruled paper, one red margin line down the left, biro-blue ink, HB-pencil yellow for highlights. */
:root{
  --paper:#FBFBF6;
  --paper-2:#F1F3EC;
  --ink:#1D2858;
  --ink-soft:#4B557F;
  --rule:#D3DDEE;
  --margin:#E0474C;
  --pencil:#F6C51B;
  --pencil-ink:#1D2858;
  --card:#FFFFFF;
  --good:#1F7A4D;
  --flat:#9A5B00;
  --font-display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-hand:"Caveat", "Comic Sans MS", cursive;
  --line:32px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141932; --paper-2:#1B2140; --ink:#E9ECF8; --ink-soft:#A9B0D3;
    --rule:#262E55; --margin:#FF6B6F; --pencil:#F6C51B; --pencil-ink:#141932;
    --card:#1C2246; --good:#5CD39A; --flat:#F2B35B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141932; --paper-2:#1B2140; --ink:#E9ECF8; --ink-soft:#A9B0D3;
  --rule:#262E55; --margin:#FF6B6F; --pencil:#F6C51B; --pencil-ink:#141932;
  --card:#1C2246; --good:#5CD39A; --flat:#F2B35B; color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto} *{animation:none!important;transition:none!important}}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:18px;
  line-height:1.6;
  background-image:
    linear-gradient(to right, transparent calc(max(16px, env(safe-area-inset-left,0px)) + 18px), var(--margin) calc(max(16px, env(safe-area-inset-left,0px)) + 18px), var(--margin) calc(max(16px, env(safe-area-inset-left,0px)) + 20px), transparent calc(max(16px, env(safe-area-inset-left,0px)) + 20px)),
    repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--line) - 1px), var(--rule) calc(var(--line) - 1px), var(--rule) var(--line));
  background-attachment:local;
}
a{color:inherit}
:focus-visible{outline:3px solid var(--pencil);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.inset{padding-left:28px}
h1,h2,h3{font-family:var(--font-display);line-height:1.05;text-wrap:balance;margin:0;letter-spacing:-0.02em}
h2{font-size:clamp(2rem, 4.6vw, 3.4rem);font-weight:800}
h3{font-size:1.35rem;font-weight:700;letter-spacing:-0.01em}
p{margin:0}
.eyebrow{font-family:var(--font-body);font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.hand{font-family:var(--font-hand);font-weight:600;color:var(--margin);font-size:1.6rem;line-height:1.1}
.hl{background:linear-gradient(transparent 55%, var(--pencil) 55%, var(--pencil) 92%, transparent 92%);padding:0 .08em;color:var(--pencil-ink)}
section{padding-block:72px}
.lede{font-size:1.2rem;max-width:62ch;color:var(--ink-soft)}

/* nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb, var(--paper) 92%, transparent);backdrop-filter:blur(6px);border-bottom:2px solid var(--ink)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap}
.logo{font-family:var(--font-display);font-weight:800;font-size:1.7rem;text-decoration:none;letter-spacing:-0.03em;display:flex;align-items:center;gap:8px}
.logo .squig{width:34px;height:20px}
.top nav{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap}
.top nav a{text-decoration:none;font-weight:700;font-size:.88rem}
.top nav a:hover{text-decoration:underline;text-decoration-color:var(--pencil);text-decoration-thickness:4px}
.btn{display:inline-flex;align-items:center;gap:8px;font:700 1rem var(--font-body);padding:12px 20px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);text-decoration:none;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px) rotate(-1deg)}
.btn.alt{background:transparent;color:var(--ink)}
.btn.pencil{background:var(--pencil);color:var(--pencil-ink);border-color:var(--pencil-ink)}
@media (max-width:1180px){.top nav{display:none}.top .btn{margin-left:auto;padding:9px 16px}}

/* hero */
.hero{padding-block:56px 72px}
.hero .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(3rem, 8.4vw, 6.4rem);font-weight:800;letter-spacing:-0.045em}
.hero h1 .strike{position:relative;white-space:nowrap}
.hero h1 .strike::after{content:"";position:absolute;left:-4%;right:-4%;top:52%;height:.11em;background:var(--margin);transform:rotate(-3deg);border-radius:4px;opacity:.9}
.hero .sub{margin-top:24px;font-size:1.25rem;max-width:34ch}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero .note{margin-top:22px}
.draft{background:var(--card);border:2px solid var(--ink);border-radius:6px;box-shadow:8px 8px 0 var(--ink);padding:22px 22px 18px;transform:rotate(1.2deg);min-width:0}
.draft .meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink-soft);font-weight:700;letter-spacing:.06em;text-transform:uppercase;gap:8px;flex-wrap:wrap}
.draft .prompt{margin-top:10px;font-family:var(--font-display);font-weight:700;font-size:1.15rem;line-height:1.25}
.draft .text{margin-top:14px;font-size:1rem;line-height:1.7;border-left:3px solid var(--rule);padding-left:12px}
.draft .notes{margin-top:16px;display:grid;gap:10px}
.why{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:.92rem;line-height:1.45;align-items:start}
.why b{display:block}
.why .tag{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1.5px solid var(--ink);white-space:nowrap}
.why .tag.c{background:var(--pencil);color:var(--pencil-ink);border-color:var(--pencil-ink)}
.stamp{margin-top:14px;display:inline-block;font-family:var(--font-hand);font-size:1.25rem;color:var(--margin);border:2px solid var(--margin);padding:2px 10px;border-radius:6px;transform:rotate(-3deg)}
@media (max-width:900px){.hero .grid{grid-template-columns:1fr}.draft{transform:none}}

/* tool not AI */
.notai{background:var(--ink);color:var(--paper);border-block:2px solid var(--ink)}
.notai .wrap{display:grid;gap:40px}
.notai h2{font-size:clamp(2.4rem, 6.4vw, 5rem);letter-spacing:-0.04em}
.notai h2 .hl{background:linear-gradient(transparent 8%, var(--pencil) 8%, var(--pencil) 96%, transparent 96%);color:var(--pencil-ink)}
.notai .eyebrow{color:color-mix(in srgb, var(--paper) 70%, transparent)}
.notai .lede{color:color-mix(in srgb, var(--paper) 82%, transparent)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.vs .col{border:2px solid color-mix(in srgb, var(--paper) 30%, transparent);border-radius:6px;padding:22px;min-width:0}
.vs .col.us{border-color:var(--pencil);background:color-mix(in srgb, var(--pencil) 10%, transparent)}
.vs h3{margin-bottom:14px;font-size:1.2rem}
.vs ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.vs li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.vs .them li::before{content:"×";font-weight:700;color:color-mix(in srgb, var(--paper) 60%, transparent)}
.vs .us li::before{content:"✓";font-weight:700;color:var(--pencil)}
.bonnet{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;border-top:2px dashed color-mix(in srgb, var(--paper) 30%, transparent);padding-top:28px}
.bonnet .q{font-family:var(--font-display);font-weight:800;font-size:1.3rem;max-width:16ch}
.bonnet p{max-width:66ch;color:color-mix(in srgb, var(--paper) 85%, transparent)}
@media (max-width:760px){.vs{grid-template-columns:1fr}.bonnet{grid-template-columns:1fr}}

/* why lesson */
.whys .head{display:grid;gap:14px;margin-bottom:32px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{font:700 .95rem var(--font-body);padding:8px 14px;border-radius:999px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.lesson{display:grid;grid-template-columns:1fr 1fr;gap:0;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--card)}
.lesson .ex{padding:24px;min-width:0}
.lesson .ex + .ex{border-left:2px solid var(--ink)}
.lesson .lbl{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.lesson .lbl i{width:10px;height:10px;border-radius:50%;display:inline-block}
.lesson .flat i{background:var(--flat)} .lesson .works i{background:var(--good)}
.lesson .quote{margin-top:10px;font-family:var(--font-display);font-weight:700;font-size:clamp(1.25rem,2.4vw,1.6rem);line-height:1.25}
.lesson .flat .quote{color:var(--ink-soft)}
.lesson .explain{grid-column:1 / -1;border-top:2px solid var(--ink);padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:24px;background:var(--paper-2)}
.lesson .explain p{margin-top:6px}
.lesson .turn{grid-column:1 / -1;border-top:2px dashed var(--rule);padding:18px 24px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
@media (max-width:720px){.lesson{grid-template-columns:1fr}.lesson .ex + .ex{border-left:0;border-top:2px solid var(--ink)}.lesson .explain{grid-template-columns:1fr}}

/* workout */
.steps{list-style:none;margin:36px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;counter-reset:s}
.steps li{counter-increment:s;background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:22px;min-width:0;display:grid;gap:8px;align-content:start}
.steps li::before{content:counter(s);font-family:var(--font-display);font-weight:800;font-size:2.2rem;line-height:1;color:var(--margin)}
.steps .time{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.steps{grid-template-columns:1fr}}

/* learning profile */
.pgrid{margin-top:32px;display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:start}
.pq{display:grid;gap:16px;min-width:0}
.pq fieldset{margin:0;border:2px solid var(--ink);border-radius:6px;background:var(--card);padding:16px 18px 18px;min-width:0}
.pq legend{font-family:var(--font-display);font-weight:700;font-size:1.1rem;padding:0 6px;line-height:1.25}
.pq legend span{color:var(--margin);margin-right:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.opts label{cursor:pointer}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts label span{display:inline-block;padding:7px 13px;border-radius:999px;border:2px solid var(--ink);font-weight:700;font-size:.92rem;background:var(--paper)}
.opts input:checked + span{background:var(--ink);color:var(--paper)}
.opts input:focus-visible + span{outline:3px solid var(--pencil);outline-offset:2px}
.presult{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);background:var(--ink);color:var(--paper);border-radius:6px;padding:24px;display:grid;gap:12px;min-width:0}
.presult .eyebrow{color:color-mix(in srgb, var(--paper) 70%, transparent)}
.pr-name{font-size:1.8rem;font-weight:800}
.pr-sum{color:color-mix(in srgb, var(--paper) 85%, transparent)}
.pr-list{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.pr-list li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:.95rem;line-height:1.45}
.pr-list li::before{content:"✓";color:var(--pencil);font-weight:700}
.pr-list b{display:block}
.loop{border-top:2px dashed color-mix(in srgb, var(--paper) 30%, transparent);padding-top:14px;display:grid;gap:8px}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--pencil);display:inline-block}
.dots i.f{background:var(--pencil)}
.pr-priv{font-size:.82rem;color:color-mix(in srgb, var(--paper) 70%, transparent)}
@media (max-width:900px){.pgrid{grid-template-columns:1fr}.presult{position:static}}

/* rules */
.rules .grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:start}
.rules ol{margin:0;padding:0;list-style:none;display:grid;gap:18px;counter-reset:r}
.rules ol li{counter-increment:r;display:grid;grid-template-columns:44px 1fr;gap:12px}
.rules ol li::before{content:counter(r);font-family:var(--font-display);font-weight:800;font-size:1.6rem;width:40px;height:40px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;line-height:1}
.rules ol p{color:var(--ink-soft)}
.mistake{margin-top:28px;background:var(--pencil);color:var(--pencil-ink);border:2px solid var(--pencil-ink);border-radius:6px;padding:22px;transform:rotate(-1deg)}
.mistake h3{font-size:1.5rem}
.mistake p{margin-top:8px}
@media (max-width:860px){.rules .grid{grid-template-columns:1fr}}

/* detector */
.detector{background:var(--paper-2);border-block:2px solid var(--ink)}
.det{display:grid;grid-template-columns:1fr 320px;gap:24px;margin-top:32px}
.det textarea{width:100%;min-height:190px;font:1rem/1.6 var(--font-body);padding:16px;border:2px solid var(--ink);border-radius:6px;background:var(--card);color:var(--ink);resize:vertical}
.det .out{margin-top:14px;background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:16px;line-height:1.8;min-height:80px;overflow-wrap:anywhere}
.det mark{background:color-mix(in srgb, var(--margin) 22%, transparent);color:inherit;border-bottom:2px solid var(--margin);padding:0 2px;border-radius:2px}
.score{background:var(--ink);color:var(--paper);border-radius:6px;padding:22px;display:grid;gap:12px;align-content:start;min-width:0}
.score .num{font-family:var(--font-display);font-weight:800;font-size:4.6rem;line-height:.9;font-variant-numeric:tabular-nums}
.score .num small{font-size:1.4rem}
.meter{height:12px;border-radius:999px;background:color-mix(in srgb, var(--paper) 22%, transparent);overflow:hidden}
.meter span{display:block;height:100%;background:var(--pencil);transition:width .4s}
.score .verdict{font-family:var(--font-display);font-weight:700;font-size:1.2rem;line-height:1.25}
.score ul{margin:0;padding-left:18px;font-size:.92rem;color:color-mix(in srgb, var(--paper) 85%, transparent)}
.det .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
@media (max-width:860px){.det{grid-template-columns:1fr}}

/* stuck */
.stuck .card{margin-top:28px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:28px;box-shadow:6px 6px 0 var(--pencil)}
.stuck .bigbtn{font:800 1.4rem var(--font-display);padding:26px 28px;border-radius:50%;aspect-ratio:1;width:150px;max-width:100%;border:3px solid var(--ink);background:var(--margin);color:#fff;cursor:pointer;transition:transform .15s}
.stuck .bigbtn:hover{transform:rotate(-6deg) scale(1.04)}
.stuck .task{font-family:var(--font-display);font-weight:700;font-size:clamp(1.3rem,2.6vw,1.8rem);line-height:1.2}
.stuck .whyline{margin-top:10px;color:var(--ink-soft)}
.stuck .fix{margin-top:10px;font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--margin)}
@media (max-width:620px){.stuck .card{grid-template-columns:1fr;justify-items:start}}

/* tracks */
.tracks .list{margin-top:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.track{border-top:4px solid var(--ink);padding-top:14px;display:grid;gap:8px;align-content:start}
.track .len{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.track .eg{font-family:var(--font-hand);font-size:1.45rem;line-height:1.15;color:var(--ink)}
.skills{margin-top:48px;display:flex;flex-wrap:wrap;gap:10px}
.skills span{border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.92rem;background:var(--card)}
.skills span b{color:var(--margin);margin-right:6px;font-family:var(--font-display)}

/* pile + schools */
.moregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.moreitem{border-top:4px solid var(--margin);padding-top:14px;display:grid;gap:10px;align-content:start;min-width:0}
.moreitem p:not(.eyebrow){color:var(--ink-soft)}
@media (max-width:900px){.moregrid{grid-template-columns:1fr}}

/* hsc */
.hsc .box{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;border:2px solid var(--ink);border-radius:6px;background:var(--card);padding:32px;align-items:center}
.hsc .timer{font-family:var(--font-display);font-weight:800;font-size:clamp(4rem,11vw,7.5rem);line-height:.9;letter-spacing:-0.04em;font-variant-numeric:tabular-nums}
.hsc ul{margin:14px 0 0;padding-left:20px;display:grid;gap:6px}
@media (max-width:820px){.hsc .box{grid-template-columns:1fr;padding:22px}}

/* pricing */
.plans{margin-top:32px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.plan{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:24px;display:grid;gap:12px;align-content:start;min-width:0}
.plan.pick{box-shadow:8px 8px 0 var(--pencil)}
.plan .price{font-family:var(--font-display);font-weight:800;font-size:2.8rem;line-height:1;font-variant-numeric:tabular-nums}
.plan .price small{font-size:1rem;font-weight:700;color:var(--ink-soft)}
.plan ul{margin:0;padding-left:20px;display:grid;gap:4px;font-size:.98rem}
.plan .for{font-size:.85rem;color:var(--ink-soft)}
.extras{margin-top:18px;display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.extras .plan{grid-template-columns:1fr auto;align-items:center}
.extras .price{font-size:1.9rem}
@media (max-width:900px){.plans{grid-template-columns:1fr}.extras{grid-template-columns:1fr}}

/* waitlist */
.join{background:var(--pencil);color:var(--pencil-ink);border-block:2px solid var(--pencil-ink)}
.join .wrap{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.join h2{font-size:clamp(2.2rem,5.4vw,4rem)}
.join p{margin-top:14px;font-size:1.1rem}
.join form{display:grid;gap:12px}
.join label{font-weight:700;font-size:.95rem}
.join input,.join select{font:1rem var(--font-body);padding:14px;border:2px solid var(--pencil-ink);border-radius:6px;background:#FFFDF2;color:#1D2858;width:100%}
.join .btn{background:#1D2858;color:#FFFDF2;border-color:#1D2858;justify-content:center}
.join .ok{font-family:var(--font-hand);font-size:1.6rem;line-height:1.2}
.join .small{font-size:.85rem;margin-top:0}
@media (max-width:820px){.join .wrap{grid-template-columns:1fr}}

footer{padding-block:40px;border-top:2px solid var(--ink)}
footer .wrap{display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap}
footer small{color:var(--ink-soft)}
</style>
</head>
<body>
<main class="wrap inset" style="padding-block:96px;display:grid;gap:22px;max-width:760px">
  <a class="logo" href="/">Wrimble</a>
  <p class="eyebrow">Founding Wrimblers</p>
  <h1 style="font-size:clamp(2.6rem,7vw,4.6rem);font-weight:800;letter-spacing:-0.04em">Ripper. You're on the <span class="hl">list.</span></h1>
  <p class="lede">We'll email you when Founding Wrimbler spots open. The first 200 get their first year for $59.</p>
